<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div id="calculator">
        <div id="display-container">
            <div id="status-bar">
             <span id="mode-indicator">DEG</span>
             <span id="mem-indicator"></span>
            </div>
            <input type="text" id="expr-input" autocomplete="off" spellcheck="false" placeholder="0">
            <div id="result-display">0</div>
        </div>

        <div id="keypad">

         <button type="button" data-action="toggle-mode" id="btn-mode">DEG/RAD</button>
         <button type="button" data-action="mem-clear">MC</button>
         <button type="button" data-action="mem-recall">MR</button>
         <button type="button" data-action="mem-add">M+</button>
         <button type="button" data-action="mem-sub">M-</button>
         <button type="button" data-action="clear-entry">C</button>
         <button type="button" data-action="all-clear">AC</button>
         <button type="button" data-action="backspace">DEL</button>


         <button type="button" data-insert="sin(">sin</button>
         <button type="button" data-insert="cos(">cos</button>
         <button type="button" data-insert="tan(">tan</button>
         <button type="button" data-insert="asin(">asin</button>
         <button type="button" data-insert="acos(">acos</button>
         <button type="button" data-insert="atan(">atan</button>
         <button type="button" data-insert="pi">π</button>
         <button type="button" data-insert="e">e</button>

         <button type="button" data-insert="ln(">ln</button>
         <button type="button" data-insert="log(">log</button>
         <button type="button" data-insert="sqrt(">√</button>
         <button type="button" data-insert="^">^</button>
         <button type="button" data-insert="cbrt(">cbrt</button>
         <button type="button" data-insert="!">!</button>
         <button type="button" data-insert="root(">root</button>
         <button type="button" data-insert="abs(">abs</button>

         <button type="button" data-insert="nCr(">nCr</button>
         <button type="button" data-insert="nPr(">nPr</button>
         <button type="button" data-insert="gcd(">gcd</button>
         <button type="button" data-insert="lcm(">lcm</button>
         <button type="button" data-insert="x">x</button>
         <button type="button" data-insert="y">y</button>
         <button type="button" data-insert="z">z</button>
         <button type="button" data-insert="ans">ans</button>
         <button type="button" data-insert=",">,</button>

         <button type="button" data-insert="(">(</button>
         <button type="button" data-insert=")">)</button>
         <button type="button" data-insert="7">7</button>
         <button type="button" data-insert="8">8</button>
         <button type="button" data-insert="9">9</button>
         <button type="button" data-insert="/">/</button>
         <button type="button" data-insert="*">*</button>
         <button type="button" data-insert="%">%</button>

         <button type="button" data-insert="4">4</button>
         <button type="button" data-insert="5">5</button>
         <button type="button" data-insert="6">6</button>
         <button type="button" data-insert="-">-</button>
         <button type="button" data-insert="x=">x=</button>
         <button type="button" data-insert="y=">y=</button>
         <button type="button" data-insert="(">(</button>
         <button type="button" data-insert=")">)</button>

         <button type="button" data-insert="1">1</button>
         <button type="button" data-insert="2">2</button>
         <button type="button" data-insert="3">3</button>
         <button type="button" data-insert="+">+</button>
         <button type="button" data-insert="0">0</button>
         <button type="button" data-insert=".">.</button>
         <button type="button" data-action="evaluate" id="btn-eval">=</button>
         <button type="button" data-insert="00">00</button>

        </div>
    </div>
  <script src="script.js"></script>
</body>
</html>
